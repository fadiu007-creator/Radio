<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Shift Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a0e4a; --ink: #fff1e0; --accent: #ff3d8b; --muted: rgba(255,241,224,.62);
    --display: "Unbounded", "Arial Black", sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  /* Colours follow the time of day, matching the playlist schedule */
  [data-daypart="day"]  { --bg:#ffd9a0; --ink:#2a1236; --accent:#e5336d; --muted:rgba(42,18,54,.65); }
  [data-daypart="peak"] { --bg:#2a0e4a; --ink:#fff1e0; --accent:#ff3d8b; --muted:rgba(255,241,224,.62); }
  [data-daypart="late"] { --bg:#08172e; --ink:#dde9ff; --accent:#35e0c2; --muted:rgba(221,233,255,.62); }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    transition: background .8s, color .8s;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; gap: 2.2rem; text-align: center; padding-inline: 1.25rem;
  }
  .station { font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 4vw, 1.6rem); letter-spacing: .01em; }
  .daypart { color: var(--muted); font-size: .95rem; margin-top: .35rem; }

  .disc {
    position: relative; width: min(72vw, 340px); aspect-ratio: 1; border-radius: 50%;
    border: 0; cursor: pointer; background: var(--accent); color: var(--bg);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800;
    font-size: clamp(1.4rem, 6vw, 2rem);
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 22%, transparent);
    transition: transform .15s, box-shadow .3s;
  }
  .disc:active { transform: scale(.97); }
  .disc:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
  .playing .disc { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 0 26px color-mix(in srgb, var(--accent) 10%, transparent); }

  .bars { display: none; gap: 6px; align-items: flex-end; height: 56px; }
  .playing .bars { display: flex; }
  .playing .label { display: none; }
  .bars i { width: 9px; background: var(--bg); border-radius: 3px; height: 20%; animation: bounce 1s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: -.2s; } .bars i:nth-child(3) { animation-delay: -.5s; }
  .bars i:nth-child(4) { animation-delay: -.8s; } .bars i:nth-child(5) { animation-delay: -.35s; }
  @keyframes bounce { 0%,100% { height: 18%; } 50% { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bars i { animation: none; height: 60%; } }

  .now { min-height: 4.2rem; max-width: 30rem; }
  .now .title { font-weight: 600; font-size: 1.25rem; overflow-wrap: anywhere; }
  .now .artist { color: var(--muted); margin-top: .2rem; }
  .status { color: var(--muted); font-size: .9rem; margin-top: .5rem; }

  .vol { display: flex; align-items: center; gap: .8rem; width: min(80vw, 340px); }
  .vol input { flex: 1; accent-color: var(--accent); height: 28px; }
  .vol span { font-size: .9rem; color: var(--muted); }

  body.kiosk .vol, body.kiosk .daypart { display: none; }
  body.kiosk .disc { width: min(60vh, 70vw); }
</style>
</head>
<body>
  <header>
    <div class="station" id="stationName">Night Shift Radio</div>
    <div class="daypart" id="daypart"></div>
  </header>

  <button class="disc" id="toggle" aria-label="Play radio">
    <span class="label" id="label">Play</span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </button>

  <section class="now" aria-live="polite">
    <div class="title" id="title">Ready when you are</div>
    <div class="artist" id="artist"></div>
    <div class="status" id="status"></div>
  </section>

  <label class="vol">
    <span>Volume</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </label>

  <audio id="audio" preload="none"></audio>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  stationName: "Night Shift Radio",
  // Your Icecast / AzuraCast stream URL (use https so it works on an https GitHub Pages site)
  streamUrl: "https://YOUR-SERVER/listen/YOUR-STATION/radio.mp3",
  // AzuraCast now-playing endpoint (leave "" to skip track info)
  nowPlayingUrl: "https://YOUR-SERVER/api/nowplaying/YOUR-STATION",
  refreshSeconds: 15,
  // Hours (0-23) when each colour theme starts
  dayStart: 11, peakStart: 18, lateStart: 1
};
/* ==================================== */

const $ = id => document.getElementById(id);
const audio = $("audio"), toggle = $("toggle");
const params = new URLSearchParams(location.search);
if (params.has("kiosk")) document.body.classList.add("kiosk");  // add ?kiosk=1 for a bar screen
$("stationName").textContent = CONFIG.stationName;
document.title = CONFIG.stationName;

/* Daypart theme */
function daypart() {
  const h = new Date().getHours(), c = CONFIG;
  if (h >= c.peakStart || h < c.lateStart) return ["peak", "Peak hour"];
  if (h >= c.lateStart && h < c.dayStart) return ["late", "Late night"];
  return ["day", "Daytime"];
}
function applyDaypart() {
  const [key, name] = daypart();
  document.body.dataset.daypart = key;
  $("daypart").textContent = name;
}
applyDaypart(); setInterval(applyDaypart, 60000);

/* Volume */
audio.volume = parseFloat(localStorage.getItem("vol") ?? 0.8);
$("volume").value = audio.volume;
$("volume").addEventListener("input", e => {
  audio.volume = +e.target.value;
  try { localStorage.setItem("vol", e.target.value); } catch {}
});

/* Playback */
let wantPlaying = false, retryTimer = null, wakeLock = null;

function setUI(playing) {
  document.body.classList.toggle("playing", playing);
  $("label").textContent = playing ? "" : "Play";
  toggle.setAttribute("aria-label", playing ? "Pause radio" : "Play radio");
}
function setStatus(t) { $("status").textContent = t || ""; }

async function start() {
  wantPlaying = true;
  clearTimeout(retryTimer);
  setStatus("Connecting…");
  // Reload the stream each time so it's live, not buffered from the past
  audio.src = CONFIG.streamUrl + (CONFIG.streamUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
  try {
    await audio.play();
    setUI(true); setStatus("");
    requestWake();
    updateMediaSession();
    fetchNow();
  } catch (e) {
    setUI(false);
    setStatus("Couldn't start the stream. Tap Play to try again.");
    wantPlaying = false;
  }
}
function stop() {
  wantPlaying = false;
  clearTimeout(retryTimer);
  audio.pause(); audio.removeAttribute("src"); audio.load();
  setUI(false); setStatus("");
  releaseWake();
}
toggle.addEventListener("click", () => wantPlaying ? stop() : start());

/* Auto-reconnect if the stream drops */
function scheduleRetry() {
  if (!wantPlaying) return;
  setUI(false); setStatus("Connection lost. Reconnecting…");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(start, 4000);
}
audio.addEventListener("error", scheduleRetry);
audio.addEventListener("stalled", () => { if (wantPlaying) setTimeout(() => { if (audio.readyState < 3) scheduleRetry(); }, 8000); });
audio.addEventListener("ended", scheduleRetry);

/* Keep the screen on for bar tablets while playing */
async function requestWake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wantPlaying) requestWake(); });

/* Now playing */
let current = { title: "", artist: "", art: "" };
async function fetchNow() {
  if (!CONFIG.nowPlayingUrl || CONFIG.nowPlayingUrl.includes("YOUR-SERVER")) return;
  try {
    const r = await fetch(CONFIG.nowPlayingUrl, { cache: "no-store" });
    const j = await r.json();
    const s = j.now_playing?.song || {};
    current = { title: s.title || CONFIG.stationName, artist: s.artist || "", art: s.art || "" };
    $("title").textContent = current.title;
    $("artist").textContent = current.artist;
    updateMediaSession();
  } catch { /* keep last known track */ }
}
setInterval(() => { if (wantPlaying) fetchNow(); }, CONFIG.refreshSeconds * 1000);

/* Lock-screen / headset controls */
function updateMediaSession() {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: current.title || CONFIG.stationName,
    artist: current.artist || CONFIG.stationName,
    artwork: current.art ? [{ src: current.art }] : []
  });
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", stop);
}
</script>
</body>
</html>
