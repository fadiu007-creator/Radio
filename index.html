<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Shift Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a0e4a; --ink: #fff1e0; --accent: #ff3d8b; --muted: rgba(255,241,224,.62);
    --display: "Unbounded", "Arial Black", sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  [data-daypart="day"]  { --bg:#ffd9a0; --ink:#2a1236; --accent:#e5336d; --muted:rgba(42,18,54,.65); }
  [data-daypart="peak"] { --bg:#2a0e4a; --ink:#fff1e0; --accent:#ff3d8b; --muted:rgba(255,241,224,.62); }
  [data-daypart="late"] { --bg:#08172e; --ink:#dde9ff; --accent:#35e0c2; --muted:rgba(221,233,255,.62); }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    transition: background .8s, color .8s;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; gap: 2.2rem; text-align: center; padding-inline: 1.25rem;
  }
  .station { font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 4vw, 1.6rem); }
  .daypart { color: var(--muted); font-size: .95rem; margin-top: .35rem; }

  .disc {
    position: relative; width: min(72vw, 340px); aspect-ratio: 1; border-radius: 50%;
    border: 0; cursor: pointer; background: var(--accent); color: var(--bg);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800;
    font-size: clamp(1.4rem, 6vw, 2rem);
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 22%, transparent);
    transition: transform .15s, box-shadow .3s, opacity .3s;
  }
  .disc:disabled { opacity: .45; cursor: default; }
  .disc:active:not(:disabled) { transform: scale(.97); }
  .disc:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
  .playing .disc { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 0 26px color-mix(in srgb, var(--accent) 10%, transparent); }

  .bars { display: none; gap: 6px; align-items: flex-end; height: 56px; }
  .playing .bars { display: flex; }
  .playing .label { display: none; }
  .bars i { width: 9px; background: var(--bg); border-radius: 3px; height: 20%; animation: bounce 1s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: -.2s; } .bars i:nth-child(3) { animation-delay: -.5s; }
  .bars i:nth-child(4) { animation-delay: -.8s; } .bars i:nth-child(5) { animation-delay: -.35s; }
  @keyframes bounce { 0%,100% { height: 18%; } 50% { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bars i { animation: none; height: 60%; } }

  .now { min-height: 4.2rem; max-width: 30rem; }
  .now .title { font-weight: 600; font-size: 1.25rem; overflow-wrap: anywhere; }
  .now .artist { color: var(--muted); margin-top: .2rem; }
  .status { color: var(--muted); font-size: .9rem; margin-top: .5rem; }

  .vol { display: flex; align-items: center; gap: .8rem; width: min(80vw, 340px); }
  .vol input { flex: 1; accent-color: var(--accent); height: 28px; }
  .vol span { font-size: .9rem; color: var(--muted); }

  body.kiosk .vol, body.kiosk .daypart { display: none; }
  body.kiosk .disc { width: min(60vh, 70vw); }
</style>
</head>
<body>
  <header>
    <div class="station" id="stationName">Night Shift Radio</div>
    <div class="daypart" id="daypart"></div>
  </header>

  <button class="disc" id="toggle" aria-label="Play radio" disabled>
    <span class="label" id="label">Play</span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </button>

  <section class="now" aria-live="polite">
    <div class="title" id="title">Loading the playlist…</div>
    <div class="artist" id="artist"></div>
    <div class="status" id="status"></div>
  </section>

  <label class="vol">
    <span>Volume</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </label>

  <audio id="audio" preload="auto"></audio>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  stationName: "Night Shift Radio",
  playlistUrl: "playlist.json",   // list of file names inside the music folder
  musicFolder: "music/",
  shuffle: true,                  // reshuffles each time the whole playlist has played
  epoch: Date.UTC(2026, 0, 1),    // shared start time: everyone hears the same moment
  dayStart: 11, peakStart: 18, lateStart: 1   // colour themes by hour (0-23)
};
/* ==================================== */

const $ = id => document.getElementById(id);
const audio = $("audio"), toggle = $("toggle");
if (new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");
$("stationName").textContent = CONFIG.stationName;
document.title = CONFIG.stationName;

/* Colour theme by time of day */
function applyDaypart() {
  const h = new Date().getHours(), c = CONFIG;
  let key = "day", name = "Daytime";
  if (h >= c.peakStart || h < c.lateStart) { key = "peak"; name = "Peak hour"; }
  else if (h < c.dayStart) { key = "late"; name = "Late night"; }
  document.body.dataset.daypart = key;
  $("daypart").textContent = name;
}
applyDaypart(); setInterval(applyDaypart, 60000);

/* Volume */
audio.volume = parseFloat(localStorage.getItem("vol") ?? 0.8);
$("volume").value = audio.volume;
$("volume").addEventListener("input", e => {
  audio.volume = +e.target.value;
  try { localStorage.setItem("vol", e.target.value); } catch {}
});

/* ---------- Playlist loading ---------- */
let tracks = [];   // {file, title, artist, dur}

function parseName(file) {
  const base = file.replace(/\.[^.]+$/, "");
  const i = base.indexOf(" - ");
  return i > 0 ? { artist: base.slice(0, i).trim(), title: base.slice(i + 3).trim() }
               : { artist: "", title: base.trim() };
}
function trackUrl(file) { return CONFIG.musicFolder + encodeURIComponent(file); }

function getDuration(file) {
  const key = "dur:" + file;
  try { const c = parseFloat(localStorage.getItem(key)); if (c > 0) return Promise.resolve(c); } catch {}
  return new Promise(resolve => {
    const a = new Audio();
    const done = d => { a.src = ""; resolve(d); };
    a.preload = "metadata";
    a.onloadedmetadata = () => {
      const d = a.duration;
      if (isFinite(d) && d > 0) { try { localStorage.setItem(key, d); } catch {} done(d); } else done(0);
    };
    a.onerror = () => done(0);
    setTimeout(() => done(0), 15000);
    a.src = trackUrl(file);
  });
}

async function loadPlaylist() {
  try {
    const r = await fetch(CONFIG.playlistUrl, { cache: "no-cache" });
    const j = await r.json();
    const files = (Array.isArray(j) ? j : j.tracks || []).filter(Boolean);
    if (!files.length) throw new Error("empty");
    const out = [];
    for (let i = 0; i < files.length; i += 4) {          // 4 at a time
      const batch = files.slice(i, i + 4);
      const durs = await Promise.all(batch.map(getDuration));
      batch.forEach((f, k) => { if (durs[k] > 0) out.push({ file: f, ...parseName(f), dur: durs[k] }); });
      $("title").textContent = "Loading the playlist… " + Math.min(i + 4, files.length) + "/" + files.length;
    }
    if (!out.length) throw new Error("nothing playable");
    tracks = out;
    $("title").textContent = "Ready when you are";
    toggle.disabled = false;
  } catch (e) {
    $("title").textContent = "No music yet";
    $("status").textContent = "Upload MP3s to the music folder and list them in playlist.json.";
  }
}
loadPlaylist();

/* ---------- Radio schedule (same song at the same moment for everyone) ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function orderFor(cycle) {
  const list = tracks.slice();
  if (!CONFIG.shuffle) return list;
  const rnd = mulberry32(cycle + 1);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}
function slotAt(ms) {
  const total = tracks.reduce((s, t) => s + t.dur, 0);
  const elapsed = Math.max(0, (ms - CONFIG.epoch) / 1000);
  const cycle = Math.floor(elapsed / total);
  let pos = elapsed - cycle * total;
  for (const t of orderFor(cycle)) {
    if (pos < t.dur) return { track: t, offset: pos, remaining: t.dur - pos };
    pos -= t.dur;
  }
  const t = tracks[0]; return { track: t, offset: 0, remaining: t.dur };
}

/* ---------- Playback ---------- */
let wantPlaying = false, current = null, wakeLock = null;

function setUI(playing) {
  document.body.classList.toggle("playing", playing);
  $("label").textContent = playing ? "" : "Play";
  toggle.setAttribute("aria-label", playing ? "Pause radio" : "Play radio");
}
function showTrack(t) {
  current = t;
  $("title").textContent = t.title;
  $("artist").textContent = t.artist;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || CONFIG.stationName });
    navigator.mediaSession.setActionHandler("play", start);
    navigator.mediaSession.setActionHandler("pause", stop);
  }
}

function tuneIn() {
  let slot = slotAt(Date.now());
  // If we just finished a track and the clock hasn't ticked over yet, jump to the next one
  if (current && slot.track.file === current.file && slot.remaining < 2)
    slot = slotAt(Date.now() + slot.remaining * 1000 + 100);
  const off = Math.floor(slot.offset);
  audio.src = trackUrl(slot.track.file) + "#t=" + off;
  audio.play().then(() => {
    setUI(true); $("status").textContent = "";
    if (Math.abs(audio.currentTime - slot.offset) > 3) { try { audio.currentTime = slot.offset; } catch {} }
  }).catch(() => {
    setUI(false); wantPlaying = false;
    $("status").textContent = "Tap Play to start.";
  });
  showTrack(slot.track);
}

function start() { if (!tracks.length) return; wantPlaying = true; tuneIn(); requestWake(); }
function stop() {
  wantPlaying = false;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  setUI(false); releaseWake();
}
toggle.addEventListener("click", () => wantPlaying ? stop() : start());

/* Next song, or skip a broken file */
audio.addEventListener("ended", () => { if (wantPlaying) tuneIn(); });
audio.addEventListener("error", () => {
  if (!wantPlaying) return;
  $("status").textContent = "Skipping a track that won't play…";
  setTimeout(() => { if (wantPlaying) { if (current) { tracks = tracks.filter(t => t.file !== current.file); } if (tracks.length) tuneIn(); else stop(); } }, 800);
});

/* Re-sync if the phone slept or playback drifted */
function checkDrift() {
  if (!wantPlaying || !current || audio.paused) return;
  const slot = slotAt(Date.now());
  if (slot.track.file !== current.file || Math.abs(audio.currentTime - slot.offset) > 4) tuneIn();
}
setInterval(checkDrift, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wantPlaying) { requestWake(); checkDrift(); }
});

/* Keep the screen on for bar tablets */
async function requestWake() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }
</script>
</body>
</html>
